name: Refresh headlines

on:
  schedule:
    - cron: "15 5-21/2 * * *"   # every 2 hours, roughly 6am-10pm UK time
  workflow_dispatch:            # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser
      - run: python3 build_news.py
      - name: Save news.json if it changed
        run: |
          count=$(python3 -c "import json;print(len(json.load(open('news.json'))['items']))")
          if [ "$count" -lt 60 ]; then echo "Only $count stories - not publishing"; git checkout news.json; exit 0; fi
          git config user.name "dispatch-bot"
          git config user.email "dispatch-bot@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || (git commit -m "Refresh headlines" && git push)
